<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personaliza tu paquete | Latam Expeditions</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" href="assets/img/isotipo-latam-expeditions.png">
<link rel="stylesheet" href="assets/css/main.css">
<style>body{font:14px Inter,Arial,sans-serif;background:#f6faf7;color:#0a3d2c;display:grid;place-items:center;min-height:95dvh;padding:20px;text-align:center}
main{background:#fff;max-width:550px;padding:35px;border:1px solid #e4efe7;border-radius:15px}a{color:#07873e;font-weight:800}</style>
<script>
(function(){
 const params=new URLSearchParams(location.search);
 const slug=/^[a-z0-9-]{3,100}$/.test(params.get('package')||'')?params.get('package'):'medellin-esencial';
 const next=new URL('paquetes/'+slug+'.html',location.href);
 const keys={origin:'origen',origen:'origen',arrival:'fecha',fecha:'fecha',adults:'adultos',
  adultos:'adultos',children:'ninos',ninos:'ninos'};
 Object.keys(keys).forEach(k=>{if(params.has(k))next.searchParams.set(keys[k],params.get(k))});
 next.hash='personaliza';location.replace(next.toString());
})();
</script></head>
<body><main><h1>Personaliza tu paquete</h1><p>El configurador ahora forma parte de la ficha del paquete, con los estilos actuales de Latam Expeditions.</p>
<a href="paquetes.html">Ver todos los paquetes</a></main></body>
</html>
